[project]
name = "viktor-mcp-worker"
version = "0.1.0"
description = "Persistent MCP bridge for the VIKTOR Generic Worker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]>=1.27,<2",
]

[project.scripts]
mcp-bridge-cli = "viktor_mcp_worker.cli:main"
mcp-bridge-service = "viktor_mcp_worker.service:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]
